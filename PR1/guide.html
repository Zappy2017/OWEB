<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Guides | Travel Planner</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/guide.css" />

  <body>

      data-component="navbar"
      class="container p-2 my-2 border rounded-pill"

    <div class="container p-0" style="margin-top: 35px">
      <!-- Back link, only shown when reading a single article -->
      <a
        id="back-link"
        href="guide.html"
        class="btn btn-light rounded-pill mb-3 d-none"
      >
        <i class="fa-solid fa-arrow-left"></i> All guides
      </a>

      <!-- Article list or single article injected by JS -->
      <div id="guide-container"></div>
    </div>

    <div
      data-component="footer"
      class="container p-0"
      style="max-width: none"
    ></div>

    <script src="assets/components.js"></script>
    <script src="js/guide/guide.js" type="module"></script>
