<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Travel Planner</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div
      data-component="navbar"
      class="container p-2 my-2 border rounded-pill"
    ></div>

    <div class="container p-0" style="margin-top: 35px; min-height: 100vh">
      <div class="login-card border rounded-4 p-4 mx-auto">
        <div class="text-center mb-4">
          <i class="fa-solid fa-earth-europe login-icon"></i>
          <h2 class="mt-2 mb-1">Welcome back</h2>
          <p class="text-muted mb-0">Log in to plan your next trip</p>
        </div>

        <div id="login-error" class="alert alert-danger d-none"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input
              type="email"
              id="login-email"
              class="form-control rounded-pill"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="login-password"
                class="form-control rounded-pill"
                placeholder="Enter your password"
                autocomplete="current-password"
                minlength="6"
                required
              />
              <button
                type="button"
                id="toggle-password"
                class="password-toggle"
                aria-label="Show password"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback">
              Password must be at least 6 characters.
            </div>
          </div>

          <button type="submit" class="btn btn-primary rounded-pill btn-block">
            Log in
          </button>
        </form>

        <p class="text-muted small text-center mt-3 mb-0">
          Demo account: <strong>demo@travel.com</strong> /
          <strong>demo123</strong>
        </p>
      </div>
    </div>

    <div
      data-component="footer"
      class="container p-0"
      style="max-width: none"
    ></div>

    <script src="assets/components.js"></script>
    <script src="js/login/login.js" type="module"></script>
  </body>
</html>
