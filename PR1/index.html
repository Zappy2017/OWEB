<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Planner</title>
    <!-- Latest compiled and minified CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
    />
    <!-- jQuery library -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <!-- Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div
      data-component="navbar"
      class="container p-2 my-2 border rounded-pill"
    ></div>

    <div
      class="container d-flex p-0"
      style="gap: 10px; justify-content: space-between; margin-top: 35px"
    >
      <h2>Your Destinations</h2>
      <button class="btn btn-primary rounded-pill">
        Add
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>

    <div
      id="destinations-container"
      class="layout container p-0 my-3 w-100 over"
    >
      <!-- Inner Card JS Injected -->
    </div>

    <div
      data-component="footer"
      class="container p-0"
      style="max-width: none"
    ></div>

    <script src="assets/components.js"></script>
    <script src="js/index.js" type="module"></script>
  </body>
</html>
