<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Planner</title>
    <!-- Latest compiled and minified CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
    />
    <!-- jQuery library -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <!-- Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div
      data-component="navbar"
      class="container p-2 my-2 border rounded-pill"
    ></div>

    <div
      class="container d-flex p-0"
      style="gap: 10px; justify-content: space-between; margin-top: 35px"
    >
      <h2>Your Destinations</h2>
      <button
        type="button"
        data-toggle="modal"
        data-target="#addPlaceModal"
        class="btn btn-primary rounded-pill"
      >
        Add
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>

    <div
      id="destinations-container"
      class="layout container p-0 my-3 w-100 over"
    >
      <!-- Inner Card JS Injected -->
    </div>

    <div
      data-component="footer"
      class="container p-0"
      style="max-width: none"
    ></div>

    <!-- POPUPS -->
    <div
      class="modal fade"
      id="addPlaceModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="addPlaceModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content rounded-4">
          <div class="modal-header">
            <h5 class="modal-title" id="addPlaceModalLabel">
              Add a destination
            </h5>
            <button type="button" class="close" data-dismiss="modal">
              <span>&times;</span>
            </button>
          </div>

          <form id="addPlaceForm">
            <div class="modal-body">
              <div class="form-group">
                <label for="placeSelect">Destination</label>
                <select
                  id="placeSelect"
                  class="form-control rounded-pill"
                  required
                >
                  <option value="" disabled selected>
                    Choose a destination
                  </option>
                </select>
              </div>

              <div class="form-group mb-0">
                <label for="placeCost">Estimated cost (€)</label>
                <input
                  type="number"
                  class="form-control rounded-pill"
                  id="placeCost"
                  placeholder="Enter estimated cost"
                  min="0"
                  step="0.01"
                  required
                />
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-light rounded-pill"
                data-dismiss="modal"
              >
                Cancel
              </button>

              <button type="submit" class="btn btn-primary rounded-pill">
                Add destination
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="assets/components.js"></script>
    <script src="js/index.js" type="module"></script>
  </body>
</html>
