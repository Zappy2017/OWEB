<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Planner</title>
    <!-- Latest compiled and minified CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
    />
    <!-- jQuery library -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <!-- Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div
      data-component="navbar"
      class="container p-2 my-2 border rounded-pill bg-light"
    ></div>

    <div class="layout container p-0 my-3 w-100 over">
      <!-- Inner Card -->
      <div
        class="container border rounded-5 p-0 m-0 w-100 overflow-hidden"
        style="height: 300px; position: relative"
      >
        <img class="card-image" src="" alt="" />
        <div class="info-container">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h5 class="destination-name">Seattle</h5>
              <span class="destination-country">
                <i class="fa-solid fa-location-dot"></i>
                Trinidad and Tobago
              </span>
            </div>

            <span class="destination-rating">
              <i class="fa-solid fa-star"></i>
              4.8
            </span>
          </div>

          <span class="popular-badge">Popular</span>
        </div>
      </div>
    </div>

    <script src="assets/components.js"></script>
  </body>
</html>
